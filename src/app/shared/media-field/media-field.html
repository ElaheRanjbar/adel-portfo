<div class="media-field">
  <label class="form-group"
    >نشانی {{ label() }}
    <input
      type="text"
      dir="ltr"
      [ngModel]="value().startsWith('asset:') ? '' : value()"
      (ngModelChange)="valueChange.emit($event)"
      [placeholder]="
        kind() === 'image' ? 'نشانی تصویر یا انتخاب فایل' : 'نشانی رزومه یا انتخاب فایل'
      "
    />
  </label>
  @if (value().startsWith('asset:')) {
    <p class="file-status">✓ {{ media.name(value()) || 'فایل آپلودشده آماده است' }}</p>
  }
  <div class="media-actions">
    <label class="upload-button"
      >{{ busy() ? 'در حال آپلود…' : '↑ انتخاب یا تعویض فایل' }}
      <input
        type="file"
        [attr.aria-label]="'انتخاب فایل ' + label()"
        [accept]="
          kind() === 'image'
            ? 'image/jpeg,image/png,image/webp,image/gif,image/avif'
            : '.pdf,.doc,.docx'
        "
        [disabled]="busy()"
        (change)="upload($event)"
      />
    </label>
    @if (value()) {
      <button type="button" (click)="valueChange.emit(''); fileNameChange.emit('')">
        حذف فایل
      </button>
    }
  </div>
  @if (value() && kind() === 'image') {
    <img [src]="value() | mediaUrl" [alt]="'پیش‌نمایش ' + label()" class="media-preview" />
  }
  @if (value() && kind() === 'document') {
    <a [href]="value() | mediaUrl" target="_blank" rel="noopener">مشاهدهٔ رزومهٔ فعلی ↗</a>
  }
  @if (error()) {
    <p role="alert" class="field-error">{{ error() }}</p>
  }
</div>
