services:
  portfolio:
    build: .
    ports:
      - '3000:3000'
    env_file: backend/.env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_PATH: /app/backend/data/portfolio.sqlite
      UPLOAD_DIR: /app/backend/data/uploads
    volumes:
      - portfolio-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  portfolio-data:
