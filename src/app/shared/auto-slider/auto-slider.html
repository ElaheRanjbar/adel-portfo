<div class="slider" role="region" [attr.aria-label]="label()">
  <div
    #viewport
    class="slider-window"
    [class.continuous]="!clickToPause()"
    [attr.tabindex]="clickToPause() ? 0 : null"
    [attr.aria-label]="
      label() +
      (clickToPause()
        ? '. Click or press Space to pause or resume. Use the arrow keys to browse.'
        : '')
    "
    (click)="togglePlayback($event)"
    (keydown)="keydown($event)"
    (pointerdown)="pointerDown($event)"
    (pointermove)="pointerMove($event)"
    (pointerup)="pointerUp()"
    (pointercancel)="pointerUp()"
    (dragstart)="$event.preventDefault()"
  >
    <div class="slider-track" [style.gap.px]="gap()">
      @for (copy of copies(); track copy) {
        <div
          class="slider-group"
          [style.gap.px]="gap()"
          [attr.aria-hidden]="copy === 1 ? null : 'true'"
        >
          <ng-container [ngTemplateOutlet]="slides()" />
        </div>
      }
    </div>
  </div>
  @if (clickToPause()) {
    <div class="slider-controls" aria-label="Slider controls">
      <button type="button" (click)="step(-1)" aria-label="Previous slides">←</button>
      <button
        type="button"
        (click)="paused.set(!paused())"
        [attr.aria-label]="paused() ? 'Resume automatic scrolling' : 'Pause automatic scrolling'"
        [attr.aria-pressed]="paused()"
      >
        {{ paused() ? '▶' : 'Ⅱ' }}
      </button>
      <button type="button" (click)="step(1)" aria-label="Next slides">→</button>
    </div>
  }
</div>
