<div class="rich-editor-shell" (input)="syncSource()">
  <div class="editor-actions">
    <label class="attachment-button" [class.disabled]="!ready() || uploading() || sourceMode()">
      {{ uploading() ? 'Adding files…' : '＋ Attach files' }}
      <input
        type="file"
        multiple
        [disabled]="!ready() || uploading() || sourceMode()"
        (change)="attach($event)"
        aria-label="Attach files"
      />
    </label>
    <span
      >Rich text editor
      <app-admin-help
        title="Rich text editor"
        text="برای عنوان، متن، فهرست، لینک و جدول از نوار ابزار استفاده کنید. عکس را با دکمه تصویر، کشیدن یا چسباندن اضافه کنید. Attach files برای فایل پیوست است. Source کد HTML را ویرایش می‌کند. تغییرات را در پایان با دکمهٔ Save page ذخیره کنید."
    /></span>
  </div>
  @if (!ready() && !error()) {
    <p role="status">Loading editor…</p>
  }
  @if (error()) {
    <p role="alert" class="editor-error">{{ error() }}</p>
  }
  <div #editorHost></div>
</div>
