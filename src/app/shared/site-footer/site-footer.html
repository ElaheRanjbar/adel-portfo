<footer id="contact">
  <div class="container footer-cta">
    <div class="badge-pill">
      <span class="availability-dot" aria-hidden="true"></span>{{ store.data().footer.badge }}
    </div>
    <h2 [innerHTML]="store.data().footer.headline"></h2>
    <p class="footer-subtext">{{ store.data().footer.subtext }}</p>
    <div class="social-links">
      @for (social of store.data().footer.socials; track $index) {
        <a [href]="social.link" target="_blank" rel="noopener noreferrer" class="social-btn"
          ><span class="social-icon">
            @if (social.image) {
              <img [src]="social.image | mediaUrl" alt="" loading="lazy" />
            } @else {
              <app-icon [name]="social.icon || socialIcon(social.label)" />
            }</span
          >{{ social.label }}</a
        >
      }
    </div>
  </div>
  <div class="footer-bottom-wrap" [class.tall-bottom]="tallBottom()">
    <div class="container footer-bottom-bar">
      <p class="copyright">{{ store.data().footer.copyright }}</p>
      <a href="#top" (click)="scrollToTop($event)" class="back-to-top"
        ><app-icon name="top" />{{ store.data().content.topText }}</a
      >
    </div>
  </div>
</footer>
