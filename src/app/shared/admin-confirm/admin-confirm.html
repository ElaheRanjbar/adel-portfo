<dialog
  #dialog
  lang="fa"
  dir="rtl"
  aria-labelledby="confirmation-title"
  aria-describedby="confirmation-description"
  (cancel)="$event.preventDefault(); cancelled.emit()"
>
  @if (request(); as request) {
    <h2 id="confirmation-title">{{ request.title }}</h2>
    <p id="confirmation-description">{{ request.message }}</p>
    <div class="dialog-actions">
      <button type="button" autofocus (click)="cancelled.emit()">انصراف</button
      ><button type="button" class="confirm-action" (click)="confirmed.emit()">تأیید</button>
    </div>
  }
</dialog>
