<div class="rich-editor-shell" (input)="syncSource()">
  <div class="editor-actions">
    <label class="attachment-button" [class.disabled]="!ready() || uploading() || sourceMode()">
      {{ uploading() ? 'Adding files…' : '＋ Attach files' }}
      <input
        type="file"
        multiple
        [disabled]="!ready() || uploading() || sourceMode()"
        (change)="attach($event)"
        aria-label="Attach files"
      />
    </label>
    <span
      >Rich text editor
      <app-admin-help
        title="Rich text editor"
        text="برای گذاشتن عکس‌ها کنار هم، از Insert table یک ردیف و دو ستون بسازید؛ عکس را داخل هر خانه اضافه کنید. برای هر عکس جداگانه Toggle image caption را فعال کنید یا خاموش بگذارید. جدولِ عکس‌ها بدون کادر نمایش داده می‌شود و در موبایل ستونی می‌شود. برای کپشن روی عکس کلیک کنید و ابزار کپشن را بزنید. Attach files برای فایل پیوست است. Source کد HTML را ویرایش می‌کند. تغییرات را در پایان با دکمهٔ Save page ذخیره کنید."
    /></span>
  </div>
  @if (!ready() && !error()) {
    <p role="status">Loading editor…</p>
  }
  @if (error()) {
    <p role="alert" class="editor-error">{{ error() }}</p>
  }
  <div #editorHost></div>
</div>
